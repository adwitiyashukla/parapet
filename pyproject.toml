[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "parapet"
version = "0.1.0"
description = "Security posture scanner for AWS accounts and Terraform plans with CIS and FSBP mappings"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Adwitiya Shukla", email = "shuklaaw@mail.uc.edu" }]
keywords = ["aws", "cloud-security", "cspm", "terraform", "cis-benchmark", "sarif"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Operating System :: OS Independent",
]
dependencies = ["boto3>=1.34"]

[project.optional-dependencies]
dev = ["pytest>=8", "moto[s3,iam,ec2,rds,kms,cloudtrail,lambda,config,sts,s3control]>=5.0"]

[project.scripts]
parapet = "parapet.cli:main"

[project.urls]
Repository = "https://github.com/adwitiyashukla/parapet"

[tool.setuptools.packages.find]
include = ["parapet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
